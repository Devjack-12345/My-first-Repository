<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devjack-12345 · 主页风格选择</title>
    <style>
      :root {
        --bg: #081120;
        --panel: rgba(17, 24, 39, 0.8);
        --panel-soft: rgba(15, 23, 42, 0.72);
        --text: #e5edf9;
        --muted: #a5b7d4;
        --primary: #7ea6ff;
        --primary-2: #79e7c0;
        --border: rgba(148, 163, 184, 0.2);
        --shadow: 0 20px 50px rgba(7, 17, 31, 0.4);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(126, 166, 255, 0.18), transparent 24%),
          radial-gradient(circle at bottom right, rgba(121, 231, 192, 0.18), transparent 22%),
          var(--bg);
        color: var(--text);
        line-height: 1.7;
      }
      a { color: inherit; text-decoration: none; }
      .container {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }
      .header {
        padding: 28px 0 10px;
      }
      .brand {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .brand span { color: var(--primary-2); }
      .hero {
        padding: 40px 0 30px;
      }
      .hero-box {
        background: rgba(15,23,42,0.7);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 36px;
        box-shadow: var(--shadow);
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.76rem;
        color: var(--primary-2);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 4.2rem);
        line-height: 1.08;
        letter-spacing: -0.06em;
      }
      .subtitle {
        margin-top: 18px;
        max-width: 680px;
        color: var(--muted);
        font-size: 1.04rem;
      }
      .buttons {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        padding: 0.9rem 1.3rem;
        border-radius: 999px;
        font-weight: 700;
        border: 1px solid var(--border);
        transition: transform 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), #9c8eff);
        color: white;
      }
      .btn-secondary {
        background: rgba(148, 163, 184, 0.06);
        color: var(--text);
      }
      .options {
        padding: 20px 0 60px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      .card {
        position: relative;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--primary-2));
      }
      .tag {
        display: inline-block;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        background: rgba(126, 166, 255, 0.12);
        border: 1px solid rgba(126, 166, 255, 0.2);
        color: var(--primary-2);
        font-size: 0.72rem;
        font-weight: 700;
      }
      .card h3 {
        margin: 16px 0 10px;
        font-size: 1.5rem;
      }
      .card p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .mini-preview {
        height: 160px;
        border-radius: 18px;
        border: 1px solid var(--border);
        margin-bottom: 18px;
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .preview-1 { background: linear-gradient(135deg, #0f172a, #172554); }
      .preview-2 { background: linear-gradient(135deg, #0a1020, #141b31 45%, #0d1d2a); }
      .preview-3 { background: linear-gradient(135deg, #f1ece7, #e5e7eb); color: #0f172a; }
      .card .btn {
        width: 100%;
      }
      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="brand">DEV<span>JACK</span></div>
      </div>
    </header>

    <main class="container hero">
      <div class="hero-box">
        <p class="eyebrow">personal homepage</p>
        <h1>选择适合你的主页风格</h1>
        <p class="subtitle">
          下面给你准备了 3 种不同风格的个人主页，访客可以自由切换选择，
          也可以让你在不同阶段展示不同的个人形象。
        </p>
        <div class="buttons">
          <a class="btn btn-primary" href="https://github.com/Devjack-12345/My-first-Repository" target="_blank" rel="noreferrer">GitHub 仓库</a>
          <a class="btn btn-secondary" href="theme-classic.html">直接进入经典版</a>
        </div>
      </div>
    </main>

    <section class="options container">
      <div class="grid">
        <article class="card">
          <span class="tag">Style 01</span>
          <h3>经典科技风</h3>
          <div class="mini-preview preview-1">TECH</div>
          <p>适合偏程序员、开发者风格，页面简洁、专业，适合展示作品和技能。</p>
          <a class="btn btn-primary" href="theme-classic.html">预览经典版</a>
        </article>

        <article class="card">
          <span class="tag">Style 02</span>
          <h3>赛博未来风</h3>
          <div class="mini-preview preview-2">CYBER</div>
          <p>更有科技感和未来感，适合展示创新、创意和个人品��形象。</p>
          <a class="btn btn-primary" href="theme-cyber.html">预览赛博版</a>
        </article>

        <article class="card">
          <span class="tag">Style 03</span>
          <h3>极简文艺风</h3>
          <div class="mini-preview preview-3">MINIMAL</div>
          <p>适合偏文艺、简洁和高级感，适合介绍自己、创作和生活态度。</p>
          <a class="btn btn-primary" href="theme-minimal.html">预览极简版</a>
        </article>
      </div>
    </section>
  </body>
</html>
